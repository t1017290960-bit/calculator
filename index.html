<!doctype html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>帳單平分器</title><style>
*{box-sizing:border-box}body{min-height:100vh;background:radial-gradient(circle at 8% 4%,#fff0cc 0,transparent 24%),radial-gradient(circle at 92% 13%,#f2ddff 0,transparent 26%),linear-gradient(135deg,#fffaf3 0%,#f2f5ff 52%,#fef1f6 100%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#9d8de0 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to bottom,#000,transparent 68%)}main{position:relative}.card{background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 15px 40px rgba(64,55,111,.09),inset 0 1px 0 #fff;backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(64,55,111,.14)}header h1{background:linear-gradient(100deg,#4931b7,#8b3dd8 58%,#f05b91);-webkit-background-clip:text;background-clip:text;color:transparent}header .inline-flex{box-shadow:0 5px 15px #e4b83b35;background:#fff5cf;color:#875d00}.field{width:100%;border:1.5px solid #e4e0f0;border-radius:14px;padding:11px 13px;background:#fff;outline:none;transition:.18s}.field:focus{border-color:#8a73ee;box-shadow:0 0 0 4px #8a73ee20}button{transition:transform .15s,filter .15s,box-shadow .15s}button:active{transform:scale(.97)}#addPerson{background:linear-gradient(135deg,#7255e8,#a150d6);box-shadow:0 6px 14px #7255e833}#addPerson:hover{filter:brightness(1.06);box-shadow:0 9px 18px #7255e844}#expenseForm>button{background:linear-gradient(100deg,#342260,#6240a7);box-shadow:0 8px 18px #432d7030}#expenseForm>button:hover{filter:brightness(1.12)}aside .card:first-child{background:linear-gradient(135deg,#6654e8 0%,#8e55d8 55%,#d65b98 100%);box-shadow:0 18px 34px #7658ce3b;position:relative;overflow:hidden}aside .card:first-child:after{content:"🧋";position:absolute;right:18px;top:16px;font-size:46px;opacity:.24;transform:rotate(12deg)}#expenses>div{background:linear-gradient(110deg,#fff,#fbfaff);border-color:#eee9f7;transition:.18s}#expenses>div:hover{border-color:#d9cff6;transform:translateX(2px)}#balances>div{background:linear-gradient(110deg,#fbfaff,#f4f5ff)}#settlements>div{background:linear-gradient(110deg,#f1edff,#fff0f6);color:#47327e}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body class="text-slate-800"><main class="max-w-5xl mx-auto px-4 py-8 md:py-12"><header class="mb-7"><div class="inline-flex items-center gap-2 rounded-full bg-indigo-50 text-indigo-700 px-3 py-1 text-sm font-semibold mb-3">🧾 一目了然計清數</div><h1 class="text-3xl md:text-4xl font-black tracking-tight">帳單平分器</h1><p class="text-slate-500 mt-2">記下誰先付款、哪些項目要平分，或由誰歸還代墊款項。</p></header>
<div class="grid lg:grid-cols-5 gap-5"><section class="lg:col-span-3 space-y-5"><div class="card p-5 md:p-6"><div class="flex items-center justify-between gap-3 mb-4"><div><h2 class="font-bold text-lg">👥 成員</h2><p class="text-sm text-slate-500">可直接修改名稱</p></div><button id="addPerson" class="rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 font-semibold">＋ 加成員</button></div><div id="people" class="flex flex-wrap gap-2"></div></div>
<div class="card p-5 md:p-6"><h2 class="font-bold text-lg mb-1">➕ 加入帳目</h2><p class="text-sm text-slate-500 mb-4">選「平分」分攤項目；選「代墊歸還」記錄某人要還款給付款者。</p><form id="expenseForm" class="space-y-4"><div class="grid sm:grid-cols-2 gap-3"><label class="text-sm font-semibold">項目名稱<input id="desc" class="field mt-1.5" placeholder="例如：晚餐、車費" required></label><label class="text-sm font-semibold">金額（HKD）<input id="amount" class="field mt-1.5" type="number" min="0.01" step="0.01" placeholder="0.00" required></label></div><div class="grid sm:grid-cols-2 gap-3"><label class="text-sm font-semibold">由誰先付款<select id="payer" class="field mt-1.5"></select></label><label class="text-sm font-semibold">帳目方式<select id="mode" class="field mt-1.5"><option value="split">大家平分</option><option value="repay">代墊歸還</option></select></label></div><div id="options" class="rounded-2xl bg-slate-50 p-4"></div><button class="w-full rounded-xl bg-slate-900 hover:bg-slate-700 text-white py-3 font-bold">加入帳目</button></form></div>
<div class="card p-5 md:p-6"><div class="flex items-center justify-between mb-4"><h2 class="font-bold text-lg">📋 帳目明細</h2><button id="clearAll" class="text-sm text-rose-600 hover:text-rose-800">清除全部</button></div><div id="expenses" class="space-y-3"></div></div></section>
<aside class="lg:col-span-2 space-y-5"><div class="card p-5 md:p-6 bg-gradient-to-br from-indigo-600 to-violet-700 text-white border-0"><div class="text-indigo-100 text-sm font-medium">總開支</div><div id="total" class="text-3xl font-black mt-1">HK$0.00</div><div class="text-indigo-100 text-sm mt-2">包括平分項目及代墊歸還項目</div></div><div class="card p-5 md:p-6"><h2 class="font-bold text-lg mb-1">💰 每人結算</h2><p class="text-sm text-slate-500 mb-4">「應收」代表別人要付給他；「應付」代表他要還款。</p><div id="balances" class="space-y-3"></div></div><div class="card p-5 md:p-6"><h2 class="font-bold text-lg mb-3">🔁 建議轉帳</h2><div id="settlements" class="space-y-2"></div></div><div class="text-xs text-slate-400 px-1">金額以港元計算，平分時會自動處理不足一毫的差額。</div></aside></div></main>
<script>
let people=[{id:'p1',name:'我'},{id:'p2',name:'朋友 A'},{id:'p3',name:'朋友 B'}], expenses=[], seq=4;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=id=>people.find(p=>p.id===id)?.name||'已移除成員', money=c=>new Intl.NumberFormat('zh-HK',{style:'currency',currency:'HKD'}).format(c/100);
function renderPeople(){const box=$('people');box.replaceChildren();people.forEach(p=>{const wrap=document.createElement('div');wrap.className='flex items-center gap-1 rounded-xl border border-slate-200 bg-white pl-3 pr-1 py-1';const inp=document.createElement('input');inp.value=p.name;inp.setAttribute('aria-label','成員名稱');inp.className='w-24 sm:w-28 outline-none text-sm font-medium';inp.addEventListener('change',()=>{p.name=inp.value.trim()||'未命名';inp.value=p.name;renderSelectors();renderExpenses();renderResults()});const del=document.createElement('button');del.type='button';del.className='w-7 h-7 rounded-lg text-slate-400 hover:bg-rose-50 hover:text-rose-600';del.textContent='×';del.title='移除成員';del.onclick=()=>{people=people.filter(x=>x.id!==p.id);expenses=expenses.filter(e=>e.payer!==p.id&&e.beneficiary!==p.id).map(e=>({...e,participants:e.participants.filter(id=>id!==p.id)})).filter(e=>e.mode!=='split'||e.participants.length);renderAll()};wrap.append(inp,del);box.append(wrap)});renderSelectors()}
function renderSelectors(){const payer=$('payer'),old=payer.value;payer.replaceChildren();people.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;payer.append(o)});if(people.some(p=>p.id===old))payer.value=old;renderOptions()}
function renderOptions(){const box=$('options'),mode=$('mode').value;box.replaceChildren();if(mode==='split'){const label=document.createElement('div');label.className='text-sm font-semibold mb-2';label.textContent='由哪些人分攤？';box.append(label);if(!people.length){box.append('請先加入成員。');return}const row=document.createElement('div');row.className='flex flex-wrap gap-x-4 gap-y-2';people.forEach(p=>{const l=document.createElement('label');l.className='flex items-center gap-2 text-sm';const c=document.createElement('input');c.type='checkbox';c.value=p.id;c.checked=true;c.className='accent-indigo-600';l.append(c,document.createTextNode(p.name));row.append(l)});box.append(row)}else{const label=document.createElement('label');label.className='text-sm font-semibold block';label.textContent='由誰歸還給付款者？';const sel=document.createElement('select');sel.id='beneficiary';sel.className='field mt-1.5';people.filter(p=>p.id!==$('payer').value).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.append(o)});if(!sel.options.length){const o=document.createElement('option');o.textContent='請加入另一位成員';o.value='';sel.append(o)}label.append(sel);box.append(label)}}
$('mode').addEventListener('change',renderOptions);$('payer').addEventListener('change',()=>{if($('mode').value==='repay')renderOptions()});$('addPerson').onclick=()=>{people.push({id:'p'+seq++,name:'新成員'});renderAll()};
$('expenseForm').addEventListener('submit',e=>{e.preventDefault();const amount=Math.round(Number($('amount').value)*100),payer=$('payer').value,mode=$('mode').value;if(!(amount>0)||!payer)return;let item={id:Date.now()+Math.random(),desc:$('desc').value.trim()||'未命名項目',amount,payer,mode};if(mode==='split'){item.participants=[...$('options').querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!item.participants.length){alert('請至少選擇一位分攤成員。');return}}else{item.beneficiary=$('beneficiary')?.value;if(!item.beneficiary){alert('代墊歸還需要另一位成員。');return}}expenses.push(item);$('desc').value='';$('amount').value='';renderExpenses();renderResults()});
function renderExpenses(){const box=$('expenses');box.replaceChildren();if(!expenses.length){const p=document.createElement('p');p.className='text-sm text-slate-400 py-3 text-center';p.textContent='尚未加入帳目。';box.append(p);return}expenses.forEach(e=>{const row=document.createElement('div');row.className='flex items-start justify-between gap-3 rounded-xl border border-slate-100 p-3';const info=document.createElement('div');info.className='min-w-0';const title=document.createElement('div');title.className='font-semibold truncate';title.textContent=e.desc;const detail=document.createElement('div');detail.className='text-xs text-slate-500 mt-1';detail.textContent=e.mode==='split'?`由 ${person(e.payer)} 付款 · 平分：${e.participants.map(person).join('、')}`:`由 ${person(e.payer)} 代墊 · ${person(e.beneficiary)} 歸還`;info.append(title,detail);const right=document.createElement('div');right.className='flex items-center gap-2 shrink-0';const amount=document.createElement('span');amount.className='font-bold text-sm';amount.textContent=money(e.amount);const del=document.createElement('button');del.className='text-slate-400 hover:text-rose-600 px-1';del.textContent='×';del.title='刪除帳目';del.onclick=()=>{expenses=expenses.filter(x=>x.id!==e.id);renderExpenses();renderResults()};right.append(amount,del);row.append(info,right);box.append(row)})}
function renderResults(){let total=0;const data=new Map(people.map(p=>[p.id,{paid:0,share:0}]));expenses.forEach(e=>{total+=e.amount;const payer=data.get(e.payer);if(payer)payer.paid+=e.amount;if(e.mode==='split'&&e.participants.length){const base=Math.floor(e.amount/e.participants.length),extra=e.amount%e.participants.length;e.participants.forEach((id,i)=>{const d=data.get(id);if(d)d.share+=base+(i<extra?1:0)})}else if(e.mode==='repay'){const d=data.get(e.beneficiary);if(d)d.share+=e.amount}});$('total').textContent=money(total);const box=$('balances');box.replaceChildren();if(!people.length){box.textContent='請先加入成員。'}people.forEach(p=>{const d=data.get(p.id),net=d.paid-d.share,row=document.createElement('div');row.className='rounded-xl bg-slate-50 p-3';const top=document.createElement('div');top.className='flex justify-between items-center gap-2';const name=document.createElement('b');name.textContent=p.name;const status=document.createElement('span');status.className='text-sm font-bold '+(net>0?'text-emerald-700':net<0?'text-rose-600':'text-slate-500');status.textContent=net>0?`應收 ${money(net)}`:net<0?`應付 ${money(-net)}`:'已結清';top.append(name,status);const sub=document.createElement('div');sub.className='text-xs text-slate-500 mt-1';sub.textContent=`已付款 ${money(d.paid)} · 應分攤 ${money(d.share)}`;row.append(top,sub);box.append(row)});renderSettlements(data)}
function renderSettlements(data){const box=$('settlements');box.replaceChildren();let debtors=[],creditors=[];people.forEach(p=>{const net=data.get(p.id).paid-data.get(p.id).share;if(net<0)debtors.push({id:p.id,n:-net});if(net>0)creditors.push({id:p.id,n:net})});debtors.sort((a,b)=>b.n-a.n);creditors.sort((a,b)=>b.n-a.n);let i=0,j=0,lines=[];while(i<debtors.length&&j<creditors.length){const n=Math.min(debtors[i].n,creditors[j].n);if(n>0)lines.push(`${person(debtors[i].id)} 付 ${person(creditors[j].id)} ${money(n)}`);debtors[i].n-=n;creditors[j].n-=n;if(!debtors[i].n)i++;if(!creditors[j].n)j++}if(!lines.length){const p=document.createElement('p');p.className='text-sm text-slate-400';p.textContent=expenses.length?'大家已結清，暫時無須轉帳。':'加入帳目後會顯示建議轉帳方式。';box.append(p)}else lines.forEach(text=>{const p=document.createElement('div');p.className='flex items-center gap-2 rounded-xl bg-indigo-50 text-indigo-900 p-3 text-sm font-semibold';p.textContent='↗ '+text;box.append(p)})}
function renderAll(){renderPeople();renderExpenses();renderResults()}$('clearAll').onclick=()=>{if(expenses.length&&confirm('確定清除所有帳目？')){expenses=[];renderExpenses();renderResults()}};renderAll();
</script></body></html>
